<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brightside Bikes · Support</title>
<style>
  :root { --bg: #f6f4ef; --card: #fff; --ink: #1d2a23; --muted: #6b766f; --brand: #1f7a4d; --me: #e5f2ea; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--brand); color: #fff; padding: 18px 24px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 2px 0 0; opacity: .85; font-size: 14px; }
  main { max-width: 720px; margin: 24px auto; padding: 0 16px; }
  .chat { background: var(--card); border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.06); overflow: hidden; }
  #log { height: 420px; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; }
  .bot { background: #f1f1ee; align-self: flex-start; }
  .me { background: var(--me); align-self: flex-end; }
  .wait { color: var(--muted); font-style: italic; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #eee; }
  input { flex: 1; padding: 10px 12px; border: 1px solid #ccd; border-radius: 10px; font: inherit; }
  button { padding: 10px 18px; border: 0; border-radius: 10px; background: var(--brand); color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; }
  .hint { color: var(--muted); font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>
<header><h1>Brightside Bikes</h1><p>Support · ask about shipping, returns, warranty or anything else</p></header>
<main>
  <div class="chat">
    <div id="log"><div class="msg bot">Hi! I'm the Brightside support assistant. How can I help?</div></div>
    <form id="f"><input id="q" placeholder="Type your question…" autocomplete="off" required><button id="send">Send</button></form>
  </div>
  <p class="hint">Try: "How long do I have to return an item?" or "Do you ship to Canada?"</p>
</main>
<script>
  const log = document.getElementById("log"), form = document.getElementById("f"),
        q = document.getElementById("q"), send = document.getElementById("send");
  function add(text, cls) {
    const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text;
    log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
  }
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = q.value.trim(); if (!text) return;
    add(text, "me"); q.value = ""; send.disabled = true;
    const wait = add("Typing…", "bot wait");
    try {
      const r = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"},
                                          body: JSON.stringify({message: text})});
      const data = await r.json();
      wait.className = "msg bot"; wait.textContent = r.ok ? data.reply : "Sorry, something went wrong. Please try again.";
    } catch {
      wait.className = "msg bot"; wait.textContent = "Sorry, I can't reach the server right now.";
    }
    send.disabled = false; q.focus();
  });
</script>
</body>
</html>
